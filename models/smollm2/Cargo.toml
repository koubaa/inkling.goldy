[package]
name = "smollm2-goldy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "SmolLM2-135M (Llama with grouped-query attention) on Ammon and Goldy."

[lib]
name = "smollm2_goldy"
path = "src/lib.rs"

[[bin]]
name = "smollm2-goldy"
path = "src/main.rs"

[dependencies]
ammon = { workspace = true, features = ["hf-tokenizer"] }
anyhow.workspace = true
goldy.workspace = true
serde_json = "1.0"

[features]
default = []
# Internal: any GPU backend. Enable one backend feature below.
gpu = []
vulkan = ["gpu", "ammon/vulkan", "goldy/vulkan"]
cuda = ["gpu", "ammon/cuda", "goldy/cuda"]
metal = ["gpu", "ammon/metal", "goldy/metal"]
