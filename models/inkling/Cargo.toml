[package]
name = "inkling-goldy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Inkling 2 text decoder on Ammon and Goldy."

[lib]
name = "inkling_goldy"
path = "src/lib.rs"

[[bin]]
name = "inkling-goldy"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bytemuck.workspace = true
safetensors.workspace = true
memmap2.workspace = true
ammon = { workspace = true, features = ["hf-tokenizer"] }
goldy.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[features]
default = []
# Internal: any GPU backend. Enable one backend feature below.
gpu = []
vulkan = ["gpu", "ammon/vulkan", "goldy/vulkan"]
cuda = ["gpu", "ammon/cuda", "goldy/cuda"]
metal = ["gpu", "ammon/metal", "goldy/metal"]
