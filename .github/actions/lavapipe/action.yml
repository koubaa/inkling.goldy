name: Install lavapipe
description: >
  Install Mesa's lavapipe Vulkan driver and point the loader at it. Fails, rather
  than letting GPU tests skip, when the ICD is missing or is not Vulkan 1.4.

runs:
  using: composite
  steps:
    - name: Install lavapipe
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          ca-certificates \
          cmake \
          pkg-config \
          unzip \
          libvulkan1 \
          libvulkan-dev \
          mesa-vulkan-drivers \
          vulkan-tools
        lvp="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)"
        if [ -z "$lvp" ]; then
          echo "lavapipe ICD not installed; refusing to skip GPU tests"
          exit 1
        fi
        echo "VK_ICD_FILENAMES=$lvp" >> "$GITHUB_ENV"
        echo "VK_DRIVER_FILES=$lvp" >> "$GITHUB_ENV"
        DISPLAY= vulkaninfo --summary | tee /tmp/vulkaninfo.txt
        grep -E 'apiVersion[[:space:]]+= 1\.4\.' /tmp/vulkaninfo.txt
        grep -Ei 'deviceName.*(llvmpipe|lavapipe)' /tmp/vulkaninfo.txt
