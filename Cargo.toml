[package]
name = "inkling-goldy"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Inkling 2 text decoder on Ammon and Goldy."

[lib]
name = "inkling_goldy"
path = "src/lib.rs"

[[bin]]
name = "inkling-goldy"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
safetensors = "0.8"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
ammon = { path = "../ammon", default-features = false }
goldy = { path = "../goldy", default-features = false, features = ["tensor"] }

[features]
default = []
vulkan = ["ammon/vulkan", "goldy/vulkan"]
