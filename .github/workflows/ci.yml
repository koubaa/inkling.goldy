# One workspace, one job set per model. Ammon and Goldy are path dependencies
# checked out as siblings by .github/actions/checkout-deps at the commits in
# .github/pins.env. A goldy_main repository dispatch builds against Goldy main
# instead, and a manual run can override either ref.
#
# GPU tests are not optional: .github/actions/lavapipe fails if the lavapipe ICD
# is missing or is not Vulkan 1.4, and the TinyStories test fails if its assets
# are missing.
#
# Inkling: the two micro configs are the reference gate. They exercise both
# architectures, the sliding-window boundary, the loop (including a later
# pass), clipping, and the 1e-6 cached-decode check. The tiny configs are not
# run here: inkling2/tiny writes about 440 MiB of weights and 140 MiB of
# activations, inkling2_loop/tiny about 530 MiB and 220 MiB. Regenerate them
# locally with `python tools/ref/generate.py` in models/inkling. Retained
# command buffers keep their own frame-table rows, and a row holds 32768
# indices so one Mini token fits. One scheme per token, fusion on.
#
# TinyStories: stories15M must reproduce the llama3.cuda README sample before
# and after fusion settles. The bench line goes to the job summary.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ammon_ref:
        description: Ammon ref (default is the pinned commit)
        default: ""
      goldy_ref:
        description: Goldy ref (default is the pinned commit)
        default: ""
  repository_dispatch:
    types: [goldy_main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ammon-models
      - uses: ./ammon-models/.github/actions/checkout-deps
        with:
          ammon-ref: ${{ inputs.ammon_ref }}
          goldy-ref: ${{ github.event_name == 'repository_dispatch' && 'main' || inputs.goldy_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch the pinned Inkling tokenizer
        working-directory: ammon-models
        run: sh models/inkling/tools/fetch_tokenizer.sh
      - name: Check
        working-directory: ammon-models
        run: cargo check --workspace --all-targets
      - name: Host tests
        working-directory: ammon-models
        run: |
          cargo test -p inkling-goldy --lib --test tokenizer
          cargo test -p llama3-goldy

  inkling-reference-micro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: models/inkling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: models/inkling/tools/ref/requirements.lock
      - name: Install the pinned CPU reference environment
        run: python -m pip install -r tools/ref/requirements.lock
      - name: Generate the micro references and check cached decode
        run: python tools/ref/generate.py --only inkling2/micro inkling2_loop/micro

  inkling-lavapipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AMMON_ARITHMETIC_POLICY: match-recorded
    steps:
      - uses: actions/checkout@v4
        with:
          path: ammon-models
      - uses: ./ammon-models/.github/actions/checkout-deps
        with:
          ammon-ref: ${{ inputs.ammon_ref }}
          goldy-ref: ${{ github.event_name == 'repository_dispatch' && 'main' || inputs.goldy_ref }}
      - uses: ./ammon-models/.github/actions/lavapipe
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch the pinned Inkling tokenizer
        working-directory: ammon-models
        run: sh models/inkling/tools/fetch_tokenizer.sh
      - name: Vulkan tests
        working-directory: ammon-models
        run: cargo test -p inkling-goldy --features vulkan -- --test-threads=1

  tinystories-lavapipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: ammon-models
      - uses: ./ammon-models/.github/actions/checkout-deps
        with:
          ammon-ref: ${{ inputs.ammon_ref }}
          goldy-ref: ${{ github.event_name == 'repository_dispatch' && 'main' || inputs.goldy_ref }}
      - uses: ./ammon-models/.github/actions/lavapipe
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache TinyStories assets
        uses: actions/cache@v4
        with:
          path: ammon-models/models/llama3/models
          key: tinystories-${{ hashFiles('ammon-models/models/llama3/tools/fetch_assets.py') }}
      - name: Fetch stories15M and the llama2.c tokenizer
        working-directory: ammon-models/models/llama3
        run: python3 tools/fetch_assets.py --only required
      - name: Vulkan tests
        working-directory: ammon-models
        run: cargo test --release -p llama3-goldy --features vulkan -- --test-threads=1 --nocapture
      - name: Steady-state bench
        working-directory: ammon-models
        run: |
          set -euo pipefail
          cargo test --release -p llama3-goldy --features vulkan --test bench -- --ignored --nocapture \
            | tee /tmp/bench.txt
          grep -o 'BENCH.*' /tmp/bench.txt >> "$GITHUB_STEP_SUMMARY"

  models-metal:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: ammon-models
      - uses: ./ammon-models/.github/actions/checkout-deps
        with:
          ammon-ref: ${{ inputs.ammon_ref }}
          goldy-ref: ${{ github.event_name == 'repository_dispatch' && 'main' || inputs.goldy_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache TinyStories assets
        uses: actions/cache@v4
        with:
          path: ammon-models/models/llama3/models
          key: tinystories-${{ hashFiles('ammon-models/models/llama3/tools/fetch_assets.py') }}
      - name: Fetch model assets
        working-directory: ammon-models
        run: |
          sh models/inkling/tools/fetch_tokenizer.sh
          python3 models/llama3/tools/fetch_assets.py --only required
      - name: MatchRecorded and Relaxed correctness
        working-directory: ammon-models
        run: |
          set -euo pipefail
          for policy in match-recorded relaxed; do
            echo "::group::Inkling ($policy)"
            AMMON_ARITHMETIC_POLICY="$policy" \
              cargo test --release -p inkling-goldy --features metal -- --test-threads=1
            echo "::endgroup::"
            echo "::group::TinyStories ($policy)"
            AMMON_ARITHMETIC_POLICY="$policy" \
              cargo test --release -p llama3-goldy --features metal -- --test-threads=1
            echo "::endgroup::"
          done
      - name: Paired Metal decode benchmarks
        working-directory: ammon-models
        run: |
          set -euo pipefail
          for policy in match-recorded relaxed; do
            inkling_log="$(mktemp)"
            llama_log="$(mktemp)"
            AMMON_ARITHMETIC_POLICY="$policy" \
              cargo test --release -p inkling-goldy --features metal --test bench \
                -- --ignored --nocapture --test-threads=1 \
              | tee "$inkling_log"
            AMMON_ARITHMETIC_POLICY="$policy" \
              cargo test --release -p llama3-goldy --features metal --test bench \
                -- --ignored --nocapture --test-threads=1 \
              | tee "$llama_log"
            {
              echo "### Metal $policy"
              grep -o 'BENCH.*' "$inkling_log"
              grep -o 'BENCH.*' "$llama_log"
            } >> "$GITHUB_STEP_SUMMARY"
          done
