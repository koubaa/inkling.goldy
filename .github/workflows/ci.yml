# Tiny configs are not run here. inkling2/tiny writes about 440 MiB of weights
# and 140 MiB of activations; inkling2_loop/tiny writes about 530 MiB and 220 MiB.
# Both download the tiny-random/inkling-2 tokenizer. The two micro configs are
# the CI gate: they exercise both architectures, the sliding-window boundary,
# the loop (including a later pass), clipping, and the 1e-6 cached-decode check.
# Regenerate tiny locally with `python tools/ref/generate.py`.
#
# The Rust crate path-depends on ammon and goldy as siblings. GPU tests are not
# optional: the lavapipe job fails if the ICD is missing or is not Vulkan 1.4.
# Goldy and Ammon are checked out from AMMON_REF and GOLDY_REF, which are main
# except while a dependency pull request is open.
# Retained command buffers keep their own frame-table rows, and a row holds
# 32768 indices so one Mini token fits. One scheme per token, fusion on.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [goldy_main]

env:
  # Dependency PRs: https://github.com/koubaa/Ammon/pulls (cursor/kv-conv-algebra-06c6,
  # stacked on cursor/single-recording-path-06c6) and https://github.com/koubaa/goldy/pull/356
  # (stacked on #355). Repin both to main after they merge.
  AMMON_REF: cursor/kv-conv-algebra-06c6
  GOLDY_REF: cursor/cyclic-store-scalar-bounds-06c6

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout inkling.goldy
        uses: actions/checkout@v4
        with:
          path: inkling

      - name: Checkout ammon
        uses: actions/checkout@v4
        with:
          repository: koubaa/ammon
          ref: ${{ env.AMMON_REF }}
          path: ammon

      - name: Checkout goldy
        uses: actions/checkout@v4
        with:
          repository: koubaa/goldy
          ref: ${{ env.GOLDY_REF }}
          path: goldy

      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch the pinned Inkling tokenizer
        working-directory: inkling
        run: sh tools/fetch_tokenizer.sh
      - name: Check
        working-directory: inkling
        run: cargo check
      - name: Host tests
        working-directory: inkling
        run: cargo test --lib --test tokenizer

  reference-micro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ref/requirements.lock
      - name: Install the pinned CPU reference environment
        run: python -m pip install -r tools/ref/requirements.lock
      - name: Generate the micro references and check cached decode
        run: python tools/ref/generate.py --only inkling2/micro inkling2_loop/micro

  lavapipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout inkling.goldy
        uses: actions/checkout@v4
        with:
          path: inkling

      - name: Checkout ammon
        uses: actions/checkout@v4
        with:
          repository: koubaa/ammon
          ref: ${{ env.AMMON_REF }}
          path: ammon

      - name: Checkout goldy
        uses: actions/checkout@v4
        with:
          repository: koubaa/goldy
          ref: ${{ env.GOLDY_REF }}
          path: goldy

      - uses: dtolnay/rust-toolchain@stable

      - name: Install lavapipe
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            pkg-config \
            unzip \
            libvulkan1 \
            libvulkan-dev \
            mesa-vulkan-drivers \
            vulkan-tools
          lvp="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)"
          if [ -z "$lvp" ]; then
            echo "lavapipe ICD not installed; refusing to skip GPU tests"
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$lvp" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$lvp" >> "$GITHUB_ENV"
          DISPLAY= vulkaninfo --summary | tee /tmp/vulkaninfo.txt
          grep -E 'apiVersion[[:space:]]+= 1\.4\.' /tmp/vulkaninfo.txt
          grep -Ei 'deviceName.*(llvmpipe|lavapipe)' /tmp/vulkaninfo.txt

      - name: Fetch the pinned Inkling tokenizer
        working-directory: inkling
        run: sh tools/fetch_tokenizer.sh

      - name: Vulkan tests
        working-directory: inkling
        run: cargo test --features vulkan -- --test-threads=1
