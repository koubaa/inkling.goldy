# Tiny configs are not run here. inkling2/tiny writes about 440 MiB of weights
# and 140 MiB of activations; inkling2_loop/tiny writes about 530 MiB and 220 MiB.
# Both download the tiny-random/inkling-2 tokenizer. The two micro configs are
# the CI gate: they exercise both architectures, the sliding-window boundary,
# the loop (including a later pass), clipping, and the 1e-6 cached-decode check.
# Regenerate tiny locally with `python tools/ref/generate.py`.
#
# The Rust crate path-depends on ammon and goldy as siblings. GPU tests are not
# optional: the lavapipe job fails if the ICD is missing or is not Vulkan 1.4.
# Bump AMMON_REF / GOLDY_REF together. Ammon's own GOLDY_REF must be this
# goldy pin. Goldy is main (6aeaa153, merge of #338, matmul_indexed_into).

name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  AMMON_REF: b9d5985cfd4ad5740e9c72a9a154fcd432491d87
  GOLDY_REF: 6aeaa15355e7265e7f9a486410d7bf16e49a6c97

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout inkling.goldy
        uses: actions/checkout@v4
        with:
          path: inkling

      - name: Checkout ammon
        uses: actions/checkout@v4
        with:
          repository: koubaa/ammon
          ref: ${{ env.AMMON_REF }}
          path: ammon

      - name: Checkout goldy
        uses: actions/checkout@v4
        with:
          repository: koubaa/goldy
          ref: ${{ env.GOLDY_REF }}
          path: goldy

      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        working-directory: inkling
        run: cargo check
      - name: Host tests
        working-directory: inkling
        run: cargo test --lib

  reference-micro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ref/requirements.lock
      - name: Install the pinned CPU reference environment
        run: python -m pip install -r tools/ref/requirements.lock
      - name: Generate the micro references and check cached decode
        run: python tools/ref/generate.py --only inkling2/micro inkling2_loop/micro

  lavapipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout inkling.goldy
        uses: actions/checkout@v4
        with:
          path: inkling

      - name: Checkout ammon
        uses: actions/checkout@v4
        with:
          repository: koubaa/ammon
          ref: ${{ env.AMMON_REF }}
          path: ammon

      - name: Checkout goldy
        uses: actions/checkout@v4
        with:
          repository: koubaa/goldy
          ref: ${{ env.GOLDY_REF }}
          path: goldy

      - uses: dtolnay/rust-toolchain@stable

      - name: Install lavapipe
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            pkg-config \
            unzip \
            libvulkan1 \
            libvulkan-dev \
            mesa-vulkan-drivers \
            vulkan-tools
          lvp="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)"
          if [ -z "$lvp" ]; then
            echo "lavapipe ICD not installed; refusing to skip GPU tests"
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$lvp" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$lvp" >> "$GITHUB_ENV"
          DISPLAY= vulkaninfo --summary | tee /tmp/vulkaninfo.txt
          grep -E 'apiVersion[[:space:]]+= 1\.4\.' /tmp/vulkaninfo.txt
          grep -Ei 'deviceName.*(llvmpipe|lavapipe)' /tmp/vulkaninfo.txt

      - name: Vulkan tests
        working-directory: inkling
        run: cargo test --features vulkan -- --test-threads=1
