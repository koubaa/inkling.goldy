[workspace]
members = ["models/inkling", "models/llama3"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/koubaa/ammon-models"

# Ammon and Goldy are checked out as siblings of this repository; CI pins both
# in `.github/pins.env`.
[workspace.dependencies]
ammon = { path = "../ammon", default-features = false }
goldy = { path = "../goldy", default-features = false, features = ["tensor"] }
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
libc = "0.2"
memmap2 = "0.9"
safetensors = "0.8"
