# Paired Metal decode benchmark: A is current main (Goldy main + #370 for the
# Metal bindless capacity, Ammon main + #29 for the policy switch), B is every
# open Goldy and Ammon PR merged together. Both build this branch's models. See
# .github/bench/abba.sh for the run order.

name: bench-stack

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  A_GOLDY: 1d61b0b640d6fe185f9c0e151d3b0decc607be4e
  A_AMMON: 8701a25bd144d80ca0a48f61323e75f9fac85405
  B_GOLDY: 949e05d0526c59c04196d533bd0d6c33f8ed2999
  B_AMMON: eb999609948ce8ff24de9ec9095a0f8549362a9f
  AMMON_BENCH_SETTLE_STEPS: "64"
  AMMON_BENCH_TIMED_STEPS: "256"
  ROUNDS: "3"

jobs:
  metal:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          path: a/ammon-models
      - uses: actions/checkout@v4
        with:
          path: b/ammon-models
      - uses: actions/checkout@v4
        with:
          repository: koubaa/goldy
          ref: ${{ env.A_GOLDY }}
          path: a/goldy
      - uses: actions/checkout@v4
        with:
          repository: koubaa/ammon
          ref: ${{ env.A_AMMON }}
          path: a/ammon
      - uses: actions/checkout@v4
        with:
          repository: koubaa/goldy
          ref: ${{ env.B_GOLDY }}
          path: b/goldy
      - uses: actions/checkout@v4
        with:
          repository: koubaa/ammon
          ref: ${{ env.B_AMMON }}
          path: b/ammon
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch TinyStories assets
        run: |
          set -euo pipefail
          (cd a/ammon-models/models/llama3 && python3 tools/fetch_assets.py --only required)
          cp -R a/ammon-models/models/llama3/models b/ammon-models/models/llama3/
      - name: Build bench binaries
        run: |
          set -euo pipefail
          mkdir -p bin
          for v in a b; do
            for pkg in inkling llama3; do
              exe=$(cd $v/ammon-models && cargo test --release -p $pkg-goldy --features metal \
                --test bench --no-run 2>&1 | grep -o 'Executable.*(.*)' | sed 's/.*(\(.*\))/\1/')
              cp "$v/ammon-models/$exe" bin/$v-$pkg
            done
          done
          ls -l bin
      - name: Paired runs
        run: |
          set -euo pipefail
          bash a/ammon-models/.github/bench/abba.sh bin "$ROUNDS" | tee bench.log
          {
            echo "### Metal, A = main, B = open PRs (settle $AMMON_BENCH_SETTLE_STEPS, timed $AMMON_BENCH_TIMED_STEPS, $ROUNDS ABBA rounds)"
            python3 a/ammon-models/.github/bench/summarize.py bench.log main stack
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal-bench-log
          path: bench.log
